camera_edge:
  base_dir: /home/gcmc/mri-cooling-camera
  site_id: GCMCSola
  camera_backend_url: https://cam.coolmri.com/api/camera/pressure
  calibration_url: https://cam.coolmri.com/api/camera/images
  capture_interval: 60
  image_width: 1920
  image_height: 1080
  upload_enabled: true
  upload_mode: full_and_crop
  ocr_crop_coords:
    x: 708
    y: 520
    w: 364
    h: 182
  shutter_speed: 1500
  gain: 2.5
  captures_per_session: 10
  debug_save_images: false
  calibration_mode: false
  install_cron: true
  scheduled_hours: [9, 15]
  retry_every_minutes: 5
