mri_user: gcmc
mri_hostname: gcmc-sola

mri_modules:
  - temp_sensors
  - camera_edge

temp_sensors:
  project_dir: /home/gcmc/mike-mri-cooling
  service_name: mri-sensor
  site_name: GCMCSola
  scanner_id: ""
  backend_url: http://api.coolmri.com/api/metrics
  alerter_metrics_url: http://alerter.coolmri.com/metrics
  dev_backend_url: http://100.74.19.56:5001/api/metrics
  enable_dual_streaming: true
  memory_only_mode: true
  avg_window: 5
  poll_sec: 10
  enable_service: true
  start_service: true
  # Bench-staged 2026-04-07. Updated 2026-04-07 per latest user-confirmed pipe mapping.
  probe_in_id: 28-0000006e00ee
  probe_out_id: 28-0000006d701b
  probe_primary_in_id: 28-0000006d915f
  probe_primary_out_id: 28-0000006ff713
