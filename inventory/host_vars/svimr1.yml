mri_user: svimr1
ansible_become_exe: /home/svimr1/.local/bin/sudo-rs-ansible-compat
mri_hostname: svimr1

mri_modules:
  - temp_sensors

temp_sensors:
  project_dir: /home/svimr1/mike-mri-cooling
  service_name: mri-sensor
  site_name: SVIMR1
  scanner_id: ""
  backend_url: http://api.coolmri.com/api/metrics
  alerter_metrics_url: http://alerter.coolmri.com/metrics
  dev_backend_url: http://100.74.19.56:5001/api/metrics
  enable_dual_streaming: true
  memory_only_mode: true
  avg_window: 5
  poll_sec: 10
  invalid_sensor_restart_threshold: 3
  sensor_discovery_timeout_sec: 120
  sensor_discovery_interval_sec: 5
  sensor_rescan_timeout_sec: 30
  sensor_rescan_interval_sec: 5
  enable_service: true
  start_service: true
  # Calibrated five-probe replacement set installed 2026-07-29.
  # Mapping was determined from live SVI MR1 temperature signatures and
  # compared with this scanner's historical channel ranges.
  probe_in_id: 28-000000b48d28
  probe_out_id: 28-000000b323cc
  probe_primary_in_id: 28-000000b2d54b
  probe_primary_out_id: 28-000000ba3e06
  probe_room_id: 28-000000b958ec
  # Bundled calibration on GWVS, stabilized 30-sample window on 2026-07-28.
  sensor_offsets:
    "28-000000b2d54b": -0.0062
    "28-000000b323cc": 0.0667
    "28-000000b48d28": 0.0812
    "28-000000b958ec": -0.1479
    "28-000000ba3e06": 0.0063
