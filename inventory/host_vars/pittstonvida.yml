mri_user: ptv
mri_hostname: pittston-vida

mri_modules:
  - temp_sensors
  - camera_edge

temp_sensors:
  project_dir: /home/ptv/mike-mri-cooling
  service_name: mri-sensor
  site_name: PittstonVida
  scanner_id: ""
  backend_url: http://api.coolmri.com/api/metrics
  alerter_metrics_url: http://alerter.coolmri.com/metrics
  dev_backend_url: http://100.74.19.56:5001/api/metrics
  enable_dual_streaming: true
  memory_only_mode: true
  avg_window: 5
  poll_sec: 10
  enable_service: true
  start_service: true
  # Temporary live mapping enabled on 2026-04-06.
  # Remap these if the role assignments are wrong.
  # Detected IDs:
  # - 28-0000006d25b6
  # - 28-0000006d704c
  # - 28-0000006df66d
  # - 28-0000006e62a2
  # - 28-00000070d0e3
  probe_in_id: 28-0000006df66d
  probe_out_id: 28-00000070d0e3
  probe_primary_in_id: 28-0000006d704c
  probe_primary_out_id: 28-0000006d25b6
  probe_room_id: 28-0000006e62a2
  # Bench calibration performed 2026-04-06 with all probes bundled together.
  sensor_offsets:
    "28-0000006d25b6": 0.11
    "28-0000006e62a2": -0.01
    "28-0000006df66d": 0.12
    "28-0000006d704c": -0.12
    "28-00000070d0e3": -0.09

camera_edge:
  base_dir: /home/ptv/mri-cooling-camera
  site_id: PittstonVida
  camera_backend_url: https://cam.coolmri.com/api/camera/pressure
  calibration_url: https://cam.coolmri.com/api/camera/images
  capture_interval: 60
  image_width: 1920
  image_height: 1080
  upload_enabled: true
  upload_mode: cropped_only
  ocr_crop_coords:
    x: 708
    y: 520
    w: 364
    h: 182
  debug_save_images: false
  shutter_speed: 1500
  gain: 2.5
  captures_per_session: 10
  calibration_mode: false
  install_cron: true
  scheduled_hours: [9, 15]
  retry_every_minutes: 5
