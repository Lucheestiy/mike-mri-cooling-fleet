---
- name: Reboot-verify the nearby MR3 SSH resilience pilot
  hosts: agcmr3
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    ansible_become_exe: /home/agcmr3/.local/bin/sudo-rs-ansible-compat
    ssh_reboot_verify_confirm: false
    ssh_reboot_verify_host: 100.103.6.98
    ssh_reboot_verify_port: 2222
    ssh_reboot_verify_site_id: AGCMR3

  pre_tasks:
    - name: Require the exact nearby reboot pilot
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'agcmr3'
          - ssh_reboot_verify_host == ansible_host
          - ssh_reboot_verify_port | int == 2222
          - ansible_check_mode or ssh_reboot_verify_confirm | bool

    - name: Record the current boot ID
      ansible.builtin.command: cat /proc/sys/kernel/random/boot_id
      register: ssh_reboot_boot_id_before
      changed_when: false
      check_mode: false

    - name: Record the exact pre-reboot probe set
      ansible.builtin.find:
        paths: /sys/bus/w1/devices
        patterns: "28-*"
        file_type: link
        recurse: false
      register: ssh_reboot_probes_before

    - name: Require five probes before reboot
      ansible.builtin.assert:
        that:
          - ssh_reboot_probes_before.matched | int == 5

    - name: Require critical pre-reboot services
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - ssh.socket
        - ssh.service
        - tailscaled.service
        - mri-sensor.service
        - coolmri-sshd-health.timer
      changed_when: false
      check_mode: false

    - name: Capture current production telemetry
      ansible.builtin.uri:
        url: https://coolmri.com/api/sites/snapshot
        return_content: true
        timeout: 15
      delegate_to: localhost
      become: false
      register: ssh_reboot_telemetry_before_response
      check_mode: false

    - name: Select current MR3 telemetry
      ansible.builtin.set_fact:
        ssh_reboot_telemetry_before: >-
          {{ ssh_reboot_telemetry_before_response.json
             | selectattr('id', 'equalto', ssh_reboot_verify_site_id)
             | list | first | default({}) }}

    - name: Require current MR3 telemetry before reboot
      ansible.builtin.assert:
        that:
          - ssh_reboot_telemetry_before.id | default('') == ssh_reboot_verify_site_id
          - not (ssh_reboot_telemetry_before.is_offline | default(true) | bool)
          - ssh_reboot_telemetry_before.last_updated | default(0) | int > 0

  tasks:
    - name: Reboot and prove the complete pilot
      when: not ansible_check_mode
      block:
        - name: Reboot MR3 and reconnect through port 2222
          ansible.builtin.reboot:
            reboot_timeout: 420
            connect_timeout: 10
            post_reboot_delay: 15
            pre_reboot_delay: 0
            test_command: systemctl is-active ssh.socket

        - name: Prove both controller-visible SSH ports
          ansible.builtin.wait_for:
            host: "{{ ssh_reboot_verify_host }}"
            port: "{{ item }}"
            connect_timeout: 5
            timeout: 30
          loop:
            - 22
            - "{{ ssh_reboot_verify_port }}"
          delegate_to: localhost
          become: false

        - name: Read the post-reboot boot ID
          ansible.builtin.command: cat /proc/sys/kernel/random/boot_id
          register: ssh_reboot_boot_id_after
          changed_when: false

        - name: Require a new boot
          ansible.builtin.assert:
            that:
              - ssh_reboot_boot_id_after.stdout != ssh_reboot_boot_id_before.stdout

        - name: Require critical post-reboot services
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ item }}"]
          loop:
            - ssh.socket
            - ssh.service
            - tailscaled.service
            - mri-sensor.service
            - coolmri-sshd-health.timer
          changed_when: false

        - name: Require the health timer to remain enabled
          ansible.builtin.command:
            argv: [systemctl, is-enabled, coolmri-sshd-health.timer]
          changed_when: false

        - name: Wait for the exact probe set to return
          ansible.builtin.find:
            paths: /sys/bus/w1/devices
            patterns: "28-*"
            file_type: link
            recurse: false
          register: ssh_reboot_probes_after
          until: >-
            ssh_reboot_probes_after.files | map(attribute='path') | map('basename') | sort
            ==
            ssh_reboot_probes_before.files | map(attribute='path') | map('basename') | sort
          retries: 18
          delay: 10

        - name: Prove the ordinary OpenSSH watchdog after reboot
          ansible.builtin.command: /usr/local/sbin/coolmri-sshd-health
          environment:
            COOLMRI_SSH_RESCUE_HOST: "{{ ssh_reboot_verify_host }}"
            COOLMRI_SSH_RESCUE_PORT: "{{ ssh_reboot_verify_port | string }}"
            COOLMRI_SSH_FAILURE_LIMIT: "3"
            COOLMRI_SSH_RESTART_COOLDOWN_SECONDS: "900"
          changed_when: false

        - name: Verify Tailscale SSH remains intentionally disabled
          ansible.builtin.shell: |
            set -eu
            test "$(tailscale debug prefs | jq -r .RunSSH)" = false
          args:
            executable: /bin/bash
          changed_when: false

        - name: Wait for post-reboot production telemetry
          ansible.builtin.uri:
            url: https://coolmri.com/api/sites/snapshot
            return_content: true
            timeout: 15
          delegate_to: localhost
          become: false
          register: ssh_reboot_telemetry_after_response
          until:
            - >-
              not ((ssh_reboot_telemetry_after_response.json
                | selectattr('id', 'equalto', ssh_reboot_verify_site_id)
                | list | first | default({})).is_offline
                | default(true) | bool)
            - >-
              ((ssh_reboot_telemetry_after_response.json
                | selectattr('id', 'equalto', ssh_reboot_verify_site_id)
                | list | first | default({})).last_updated
                | default(0) | int)
              > (ssh_reboot_telemetry_before.last_updated | int)
          retries: 18
          delay: 10

        - name: Select recovered production telemetry
          ansible.builtin.set_fact:
            ssh_reboot_telemetry_after: >-
              {{ ssh_reboot_telemetry_after_response.json
                 | selectattr('id', 'equalto', ssh_reboot_verify_site_id)
                 | list | first }}

        - name: Write reboot-verification evidence
          ansible.builtin.copy:
            dest: >-
              {{ playbook_dir }}/../reports/ssh_resilience_reboot_{{ now(utc=true, fmt='%Y%m%d_%H%M%S') }}.json
            mode: "0644"
            content: >-
              {{ {
                'kind': 'ssh_resilience_reboot_verification',
                'ok': true,
                'inventory_name': inventory_hostname,
                'site_id': ssh_reboot_verify_site_id,
                'created_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
                'boot_id_before': ssh_reboot_boot_id_before.stdout,
                'boot_id_after': ssh_reboot_boot_id_after.stdout,
                'ordinary_ssh_ports': [22, ssh_reboot_verify_port | int],
                'tailscale_ssh_enabled': false,
                'probe_ids': ssh_reboot_probes_after.files | map(attribute='path') | map('basename') | sort,
                'telemetry_before': ssh_reboot_telemetry_before.last_updated | int,
                'telemetry_after': ssh_reboot_telemetry_after.last_updated | int
              } | to_nice_json }}
          delegate_to: localhost
          become: false
