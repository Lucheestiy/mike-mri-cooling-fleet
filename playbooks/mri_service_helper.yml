- name: Align restricted MRI sensor recovery controls
  hosts: agcmr1:agcmr2:agcmr3:oswmr1:oswmr2:svimr1:svimr2:gbh:shmr:muncymr:jsmr:gr:pittstonsola:pittstonvida:gcmcsola:gcmcmr2:gswbsola:gwvskyra:vwm2:vwm3:glh
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    mri_service_helper_confirm: false
    mri_user: "{{ ansible_user }}"
    ansible_become_exe: "/home/{{ ansible_user }}/.local/bin/sudo-rs-ansible-compat"
    mri_helper_path: /usr/local/sbin/mri-sensor-service

  pre_tasks:
    - name: Require explicit MRI helper alignment confirmation
      ansible.builtin.assert:
        that:
          - ansible_check_mode or mri_service_helper_confirm | bool
          - ansible_play_batch | length == 1
        fail_msg: >-
          Run --check first, then pass -e mri_service_helper_confirm=true with
          an explicit --limit of reachable MRI hosts.

    - name: Ensure unprivileged compatibility directory exists
      ansible.builtin.file:
        path: "/home/{{ mri_user }}/.local/bin"
        state: directory
        owner: "{{ mri_user }}"
        group: "{{ mri_user }}"
        mode: "0700"
      become: false
      check_mode: false

    - name: Install sudo-rs prompt compatibility shim
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/sudo-rs-ansible-compat"
        dest: "{{ ansible_become_exe }}"
        owner: "{{ mri_user }}"
        group: "{{ mri_user }}"
        mode: "0700"
      become: false
      check_mode: false

  tasks:
    - name: Install restricted MRI sensor service helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../roles/common/files/mri-sensor-service"
        dest: "{{ mri_helper_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install narrow MRI service-helper sudo rule
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/common/templates/mri-sensor-service.sudoers.j2"
        dest: /etc/sudoers.d/mri-sensor-service
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Verify MRI sensor state as the unprivileged fleet user
      ansible.builtin.command:
        argv: [sudo, -n, "{{ mri_helper_path }}", is-active]
      become: false
      changed_when: false
      when: not ansible_check_mode

    - name: Verify restricted MRI journal access
      ansible.builtin.command:
        argv: [sudo, -n, "{{ mri_helper_path }}", recent-logs]
      become: false
      changed_when: false
      when: not ansible_check_mode
