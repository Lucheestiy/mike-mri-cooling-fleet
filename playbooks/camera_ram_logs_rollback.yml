---
- name: Roll back nearby AGC camera RAM logs
  hosts: agcmr1:agcmr3
  gather_facts: false
  become: true
  serial: 1
  vars:
    ansible_become_exe: "/home/{{ mri_user }}/.local/bin/sudo-rs-ansible-compat"
    camera_ram_logs_state: rollback
  pre_tasks:
    - name: Require explicit rollback confirmation
      ansible.builtin.assert:
        that:
          - camera_ram_logs_rollback_confirm | default(false) | bool
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in ['agcmr1', 'agcmr3']

    - name: Ensure unprivileged compatibility directory exists
      ansible.builtin.file:
        path: "/home/{{ mri_user }}/.local/bin"
        state: directory
        owner: "{{ mri_user }}"
        group: "{{ mri_user }}"
        mode: "0700"
      become: false
      check_mode: false

    - name: Install sudo-rs prompt compatibility shim
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/sudo-rs-ansible-compat"
        dest: "{{ ansible_become_exe }}"
        owner: "{{ mri_user }}"
        group: "{{ mri_user }}"
        mode: "0700"
      become: false
      check_mode: false
  roles:
    - camera_ram_logs
