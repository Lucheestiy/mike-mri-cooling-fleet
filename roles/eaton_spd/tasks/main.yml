---
- name: Require the reviewed Eaton topology
  ansible.builtin.assert:
    that:
      - inventory_hostname in eaton_spd_allowed_hosts
      - eaton_spd_user | length > 0
      - eaton_spd_interface == 'eth0'
      - eaton_spd_pi_address == '192.168.1.10/24'
      - eaton_spd_device_ip == '192.168.1.254'
      - not eaton_spd_manage_network | bool or eaton_spd_interface_mac | length > 0
      - not eaton_spd_manage_network | bool or eaton_spd_connection_uuid | length > 0
    fail_msg: Refusing to apply the Eaton repair to an unreviewed topology.

- name: Verify the existing Eaton application and configuration
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ eaton_spd_project_dir }}/surge_to_api.py"
    - "{{ eaton_spd_project_dir }}/.env"
    - /etc/systemd/system/eth0-spd-ip.service
  register: eaton_spd_prerequisites

- name: Require all existing Eaton prerequisites
  ansible.builtin.assert:
    that:
      - eaton_spd_prerequisites.results | map(attribute='stat.exists') | list | min
      - eaton_spd_prerequisites.results | map(attribute='stat.isreg') | list | min

- name: Install the static, no-default-route Eaton Ethernet definition
  ansible.builtin.template:
    src: 95-coolmri-eaton-eth0.yaml.j2
    dest: /etc/netplan/95-coolmri-eaton-eth0.yaml
    owner: root
    group: root
    mode: "0600"
  register: eaton_spd_netplan_override
  when: eaton_spd_manage_network | bool

- name: Generate the NetworkManager profile from Netplan
  ansible.builtin.command:
    argv: [netplan, generate]
  changed_when: eaton_spd_netplan_override.changed
  when:
    - eaton_spd_manage_network | bool
    - not ansible_check_mode

- name: Reload NetworkManager profiles without disturbing Wi-Fi
  ansible.builtin.command:
    argv: [nmcli, connection, reload]
  changed_when: eaton_spd_netplan_override.changed
  when:
    - eaton_spd_manage_network | bool
    - not ansible_check_mode

- name: Activate only the dedicated Eaton Ethernet profile
  ansible.builtin.command:
    argv: [nmcli, connection, up, uuid, "{{ eaton_spd_connection_uuid }}"]
  register: eaton_spd_connection_up
  changed_when: "'successfully activated' in eaton_spd_connection_up.stdout"
  when:
    - eaton_spd_manage_network | bool
    - not ansible_check_mode

- name: Verify the NetworkManager static method
  ansible.builtin.shell: |
    test "$(nmcli -g ipv4.method connection show uuid {{ eaton_spd_connection_uuid | quote }})" = manual
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - eaton_spd_manage_network | bool
    - not ansible_check_mode

- name: Verify the dedicated Ethernet address and route isolation
  ansible.builtin.shell: |
    set -eu
    ip -4 -o address show dev {{ eaton_spd_interface | quote }} |
      awk '{print $4}' |
      grep -Fx {{ eaton_spd_pi_address | quote }}
    ip -4 route show dev {{ eaton_spd_interface | quote }} |
      grep -F "192.168.1.0/24"
    ! ip -4 route show default dev {{ eaton_spd_interface | quote }} | grep -q .
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode

- name: Prove the Eaton Modbus and web endpoints
  ansible.builtin.wait_for:
    host: "{{ eaton_spd_device_ip }}"
    port: "{{ item }}"
    connect_timeout: 3
    timeout: 15
  loop:
    - 443
    - 502
  when: not ansible_check_mode

- name: Install the Python 3.14 uploader environment
  block:
    - name: Create a fresh versioned virtual environment
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ eaton_spd_user }}"
          - --
          - /usr/bin/python3
          - -m
          - venv
          - "{{ eaton_spd_venv_dir }}"
        creates: "{{ eaton_spd_venv_dir }}/bin/pip"

    - name: Copy the reviewed uploader dependencies
      ansible.builtin.copy:
        src: requirements.txt
        dest: "{{ eaton_spd_project_dir }}/requirements-fleet.txt"
        owner: "{{ eaton_spd_user }}"
        group: "{{ eaton_spd_user }}"
        mode: "0644"
      register: eaton_spd_requirements

    - name: Install the uploader dependencies
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ eaton_spd_user }}"
          - --
          - "{{ eaton_spd_venv_dir }}/bin/python3"
          - -m
          - pip
          - install
          - --disable-pip-version-check
          - --no-input
          - -r
          - "{{ eaton_spd_project_dir }}/requirements-fleet.txt"
      register: eaton_spd_pip_install
      changed_when: "'Successfully installed' in eaton_spd_pip_install.stdout"
      when: not ansible_check_mode

    - name: Prove the Python runtime and imports
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ eaton_spd_user }}"
          - --
          - "{{ eaton_spd_venv_dir }}/bin/python3"
          - -c
          - "import requests, pymodbus, kasa; print('uploader-runtime-ok')"
      changed_when: false
      when: not ansible_check_mode

- name: Stop the obsolete local-only poller before the live proof
  ansible.builtin.systemd_service:
    name: "{{ eaton_spd_old_service }}"
    state: stopped
  when:
    - eaton_spd_manage_old_service | bool
    - not ansible_check_mode

- name: Prove a real Eaton reading reaches production
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ eaton_spd_user }}"
      - --
      - "{{ eaton_spd_venv_dir }}/bin/python3"
      - "{{ eaton_spd_project_dir }}/surge_to_api.py"
      - --once
  register: eaton_spd_live_post
  changed_when: true
  failed_when: "('POST ' ~ eaton_spd_required_post_url ~ ' -> 200') not in eaton_spd_live_post.stdout"
  when: not ansible_check_mode

- name: Install the repaired user service units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ eaton_spd_user }}/.config/systemd/user/{{ item }}"
    owner: "{{ eaton_spd_user }}"
    group: "{{ eaton_spd_user }}"
    mode: "0644"
    backup: true
  loop:
    - surge-monitor.service
    - surge-monitor.timer
  register: eaton_spd_user_units

- name: Reload the Eaton user service manager
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ eaton_spd_user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR={{ eaton_spd_user_runtime_dir }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path={{ eaton_spd_user_runtime_dir }}/bus"
      - systemctl
      - --user
      - daemon-reload
  changed_when: eaton_spd_user_units.changed
  when: not ansible_check_mode

- name: Enable the timer and restart the repaired uploader
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ eaton_spd_user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR={{ eaton_spd_user_runtime_dir }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path={{ eaton_spd_user_runtime_dir }}/bus"
      - systemctl
      - --user
      - "{{ item.action }}"
      - "{{ item.unit }}"
  loop:
    - {action: enable, unit: surge-monitor.timer}
    - {action: restart, unit: surge-monitor.timer}
    - {action: restart, unit: surge-monitor.service}
  changed_when: true
  when: not ansible_check_mode

- name: Wait for the repaired uploader to remain active
  ansible.builtin.pause:
    seconds: 15
  when: not ansible_check_mode

- name: Verify the repaired uploader process
  ansible.builtin.shell: |
    set -eu
    runuser -u {{ eaton_spd_user | quote }} -- \
      env XDG_RUNTIME_DIR={{ eaton_spd_user_runtime_dir | quote }} \
      DBUS_SESSION_BUS_ADDRESS=unix:path={{ eaton_spd_user_runtime_dir | quote }}/bus \
      systemctl --user is-active surge-monitor.service
    pid="$(pgrep -f '^{{ eaton_spd_venv_dir | regex_escape }}/bin/python3 {{ eaton_spd_project_dir | regex_escape }}/surge_to_api.py$')"
    test -n "$pid"
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode

- name: Disable the obsolete duplicate poller after production proof
  ansible.builtin.systemd_service:
    name: "{{ eaton_spd_old_service }}"
    state: stopped
    enabled: false
  when:
    - eaton_spd_manage_old_service | bool
    - not ansible_check_mode

- name: Recheck NetworkManager online readiness
  ansible.builtin.command:
    argv:
      - timeout
      - "20"
      - systemctl
      - restart
      - NetworkManager-wait-online.service
  changed_when: true
  when:
    - eaton_spd_recheck_wait_online | bool
    - not ansible_check_mode

- name: Clear any prior boot failure marker
  ansible.builtin.command:
    argv: [systemctl, reset-failed, NetworkManager-wait-online.service]
  changed_when: true
  when:
    - eaton_spd_recheck_wait_online | bool
    - not ansible_check_mode

- name: Require the production services after the Eaton repair
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  loop:
    "{{ eaton_spd_critical_services }}"
  changed_when: false
  when: not ansible_check_mode

- name: Require Tailscale SSH to remain disabled
  ansible.builtin.command:
    argv: [tailscale, debug, prefs]
  register: eaton_spd_tailscale_prefs
  changed_when: false
  failed_when: "'\"RunSSH\": false' not in eaton_spd_tailscale_prefs.stdout"
  when: not ansible_check_mode
