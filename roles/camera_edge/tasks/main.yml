- name: Fail if mri_user missing
  ansible.builtin.assert:
    that:
      - mri_user is defined
      - (mri_user | length) > 0
    fail_msg: "Set `mri_user` in inventory/host_vars/<host>.yml"

- name: Require explicit reviewed camera deployment approval
  ansible.builtin.assert:
    that:
      - camera_edge_deploy_approved | default(false) | bool
    fail_msg: >-
      Camera deployment is disabled by default. Use a guarded camera convergence
      playbook with backup, rollback, hardware-canary, and telemetry evidence;
      do not invoke this role directly against a working camera.

- name: Set camera edge paths
  ansible.builtin.set_fact:
    camera_edge_base_dir: "{{ camera_edge.base_dir | default('/home/' ~ mri_user ~ '/mri-cooling-camera', true) }}"
    camera_edge_edge_dir: "{{ (camera_edge.base_dir | default('/home/' ~ mri_user ~ '/mri-cooling-camera', true)) ~ '/edge' }}"

- name: Ensure camera user has required groups
  ansible.builtin.user:
    name: "{{ mri_user }}"
    groups:
      - video
      - render
    append: true

- name: Ensure camera system packages installed
  ansible.builtin.apt:
    name:
      - rpicam-apps
      - libcamera-tools
      - v4l-utils
      - cron
      - python3-venv
      - python3-pip
      - python3-numpy
      - python3-pil
    update_cache: true

- name: Ensure camera directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mri_user }}"
    group: "{{ mri_user }}"
    mode: "0755"
  loop:
    - "{{ camera_edge_base_dir }}"
    - "{{ camera_edge_edge_dir }}"
    - "{{ camera_edge_edge_dir }}/images"
    - "{{ camera_edge_edge_dir }}/failed_sessions"
    - "{{ camera_edge_edge_dir }}/debug_7seg"
    - "{{ camera_edge_edge_dir }}/logs"

- name: Create camera venv
  ansible.builtin.command: "python3 -m venv --system-site-packages {{ camera_edge_base_dir }}/venv"
  args:
    creates: "{{ camera_edge_base_dir }}/venv/bin/python3"
  become_user: "{{ mri_user }}"

- name: Install camera python dependencies
  ansible.builtin.command: "{{ camera_edge_base_dir }}/venv/bin/pip install -U pip python-dotenv requests"
  changed_when: false
  become_user: "{{ mri_user }}"

- name: Install reviewed camera runtime files only
  ansible.builtin.copy:
    src: "edge/{{ item.name }}"
    dest: "{{ camera_edge_edge_dir }}/{{ item.name }}"
    owner: "{{ mri_user }}"
    group: "{{ mri_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: scheduled_capture.py, mode: "0644"}
    - {name: retry_failed_sessions.py, mode: "0644"}
    - {name: run_scheduled_capture.sh, mode: "0755"}
    - {name: run_retry_check.sh, mode: "0755"}

- name: Install camera edge .env
  ansible.builtin.template:
    src: camera_edge.env.j2
    dest: "{{ camera_edge_edge_dir }}/.env"
    owner: "{{ mri_user }}"
    group: "{{ mri_user }}"
    mode: "0644"

- name: Schedule camera captures (9:00 and 15:00 by default)
  ansible.builtin.cron:
    name: "mri-camera-scheduled-capture-{{ item }}"
    state: "{{ 'present' if (camera_edge.install_cron | default(true)) else 'absent' }}"
    minute: "0"
    hour: "{{ item }}"
    user: "{{ mri_user }}"
    job: "{{ camera_edge_edge_dir }}/run_scheduled_capture.sh >/dev/null 2>&1"
  loop: "{{ camera_edge.scheduled_hours | default([9, 15]) }}"

- name: Schedule camera retry check (every N minutes)
  ansible.builtin.cron:
    name: "mri-camera-retry-check"
    state: "{{ 'present' if (camera_edge.install_cron | default(true)) else 'absent' }}"
    minute: "*/{{ camera_edge.retry_every_minutes | default(5) }}"
    user: "{{ mri_user }}"
    job: "{{ camera_edge_edge_dir }}/run_retry_check.sh >/dev/null 2>&1"
