---
- name: Capture exact cron.d schedule metadata before service pause
  ansible.builtin.stat:
    path: "{{ camera_ram_logs_crond_path }}"
    checksum_algorithm: sha256
  register: camera_ram_logs_crond_before
  check_mode: false

- name: Capture cron service state before bounded pause
  ansible.builtin.shell: |
    set -o pipefail
    systemctl is-active cron.service
    systemctl is-enabled cron.service
  args:
    executable: /bin/bash
  register: camera_ram_logs_cron_service_before
  changed_when: false
  check_mode: false

- name: Require exact healthy cron.d schedule boundary
  ansible.builtin.assert:
    that:
      - camera_ram_logs_crond_before.stat.isreg | default(false)
      - camera_ram_logs_crond_before.stat.pw_name == 'root'
      - camera_ram_logs_crond_before.stat.gr_name == 'root'
      - camera_ram_logs_crond_before.stat.mode == '0644'
      - camera_ram_logs_cron_service_before.stdout_lines == ['active', 'enabled']

- name: Arm automatic cron resume watchdog
  ansible.builtin.shell: |
    set -o pipefail
    systemctl stop '{{ camera_ram_logs_cron_watchdog_unit }}.timer' '{{ camera_ram_logs_cron_watchdog_unit }}.service' 2>/dev/null || true
    systemctl reset-failed '{{ camera_ram_logs_cron_watchdog_unit }}.service' 2>/dev/null || true
    systemd-run --quiet --unit='{{ camera_ram_logs_cron_watchdog_unit }}' --on-active=2m /bin/systemctl start cron.service
  args:
    executable: /bin/bash
  when: not ansible_check_mode
  changed_when: true

- name: Stop cron only inside the watchdog window
  ansible.builtin.command:
    argv: [systemctl, stop, cron.service]
  when: not ansible_check_mode
  changed_when: true

- name: Wait for any active camera wrapper to finish
  ansible.builtin.shell: >-
    timeout 120 bash -c 'while pgrep -u {{ mri_user | quote }} -f
    "run_(scheduled_capture|retry_check)\\.sh|scheduled_capture\\.py|retry_failed_sessions\\.py|prune_failed_sessions\\.sh"
    >/dev/null; do sleep 2; done'
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false
